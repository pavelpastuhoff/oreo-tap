<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ОРЕО — Тапалка & Экосистема</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #fff;
    background: radial-gradient(circle at 50% 55%, #2b3a7a 0%, #141a3d 55%, #070919 100%);
  }

  /* Камера пользователя на фоне с необычными фильтрами */
  #camWrap {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    opacity: 0; transition: opacity .35s ease;
  }
  #camWrap.active { opacity: 0.62; }
  #camVideo {
    width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1);
    will-change: filter, transform;
    transition: transform 0.08s ease-out;
  }
  #camOverlay {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 52%, transparent 25%, rgba(8, 10, 28, 0.78) 90%);
    mix-blend-mode: multiply;
  }

  .glow {
    position: fixed; left: 50%; top: 54%; width: 115vmin; height: 115vmin;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--glow-color, rgba(120,150,255,.38)), transparent 62%);
    transition: opacity .15s, background .35s; pointer-events: none; z-index: 1;
  }

  /* ===== Мобильный интерфейс в стиле тапалок ===== */
  :root { --safe-top: env(safe-area-inset-top, 0px); --foot: 50px; }

  /* Верхняя панель: профиль, стрик, кристаллы */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 22;
    padding: calc(var(--safe-top) + 10px) 12px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .profile {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 5px; border-radius: 99px; cursor: pointer;
    background: rgba(15, 20, 50, .82); border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(8px);
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffe58a, #ff9a2e);
  }
  .profile .meta { min-width: 0; line-height: 1.2; }
  .profile .meta b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .profile .meta small { font-size: 11px; opacity: .72; font-weight: 700; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    height: 42px; padding: 0 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(15, 20, 50, .82); color: #fff; font: 800 15px inherit;
    cursor: pointer; backdrop-filter: blur(8px); transition: transform .12s;
  }
  .pill-btn:active { transform: scale(.93); }
  .pill-btn.streak-pill { background: linear-gradient(135deg, rgba(255,105,30,.35), rgba(255,180,30,.25)); border-color: rgba(255,150,50,.6); color: #ffd78a; }
  .pill-btn.gem-pill { color: #7ce8ff; border-color: rgba(124,232,255,.45); }
  .pill-btn .plus { background: #7ce8ff; color: #04202a; width: 20px; height: 20px; border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center; }

  /* Главный счётчик */
  .hud {
    position: fixed; top: calc(var(--safe-top) + 66px); left: 0; right: 0;
    text-align: center; pointer-events: none; z-index: 5;
  }
  .big { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .big .coin { font-size: clamp(34px, 10vw, 54px); filter: drop-shadow(0 3px 8px rgba(255,190,50,.5)); }
  #count {
    font-size: clamp(32px, 10.5vw, 56px); font-weight: 900; line-height: 1.05;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff, #ffd76a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 14px rgba(255,195,70,.42));
    display: inline-block; will-change: transform;
  }
  .stats { display: flex; justify-content: center; gap: 8px; margin-top: 6px; }
  .stat {
    padding: 5px 12px; border-radius: 99px; font-size: 13px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.13);
  }
  .bar { width: min(300px, 78vw); height: 8px; margin: 10px auto 0; border-radius: 9px; background: rgba(255,255,255,.14); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6f8cff, #ffd76a); transition: width .25s; }

  /* Боковые круглые кнопки */
  .side { position: fixed; top: calc(var(--safe-top) + 172px); z-index: 20; display: flex; flex-direction: column; gap: 10px; }
  .side.left { left: 12px; }
  .side.right { right: 12px; }
  .round-btn {
    width: 48px; height: 48px; border-radius: 16px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(15, 20, 50, .82); color: #fff; font-size: 22px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
    backdrop-filter: blur(8px); transition: transform .12s, background .2s, border-color .2s;
  }
  .round-btn small { font-size: 10px; font-weight: 800; color: #ffd76a; margin-top: 2px; }
  .round-btn:active { transform: scale(.92); }
  .round-btn.active { border-color: #ffd76a; background: rgba(255, 215, 106, .22); }
  .hide { display: none; }

  /* Энергия над меню */
  .energy-dock {
    position: fixed; left: 12px; right: 12px; bottom: calc(var(--foot) + 76px); z-index: 18;
    display: flex; align-items: center; gap: 8px; max-width: 560px; margin: 0 auto;
  }
  .energy {
    flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 7px 12px; border-radius: 16px; font-weight: 800; font-size: 14px;
    background: rgba(15, 20, 50, .82); border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(8px);
  }
  .energy .bar { flex: 1; margin: 0; height: 10px; width: auto; }
  .energy-bar i { background: linear-gradient(90deg, #00e676, #ffee58); }
  .energy .e-plus { background: linear-gradient(180deg, #ffe58a, #ffb830); color: #1b1400; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .boost-chip {
    padding: 9px 12px; border-radius: 14px; font-size: 13px; font-weight: 900; white-space: nowrap;
    background: rgba(255, 215, 106, .18); border: 1px solid #ffd76a; color: #ffd76a;
  }

  /* Сцена и 3D печенька ОРЕО */
  #stage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    perspective: 900px; cursor: pointer; z-index: 2;
    padding-top: calc(var(--safe-top) + 210px); padding-bottom: calc(var(--foot) + 130px);
  }
  :root { --size: min(68vw, 34vh, 330px); }
  #wrap { width: var(--size); height: var(--size); transform-style: preserve-3d; will-change: transform; }
  #cookie { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .layer {
    position: absolute; inset: 0; border-radius: 50%;
    pointer-events: none;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .wafer { background: #2a1710; }
  .wafer.edge { background: radial-gradient(circle at 50% 50%, #3a2218 0%, #1d0f0a 100%); }
  .cream { inset: 5%; background: #f6f1e4; }
  .cream.mid { background: #fff9ea; }
  .top { background: radial-gradient(circle at 35% 30%, #4a2d20 0%, #2a1710 55%, #1a0d08 100%); overflow: hidden; }
  .top svg { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-backface-visibility: hidden; backface-visibility: hidden; }

  /* Оптимизированный 60 FPS 3D-скин Шушик (без тяжелого filter: drop-shadow на 3D-сцене) */
  #cookie.skin-shushik-3d .layer.shushik-glow-base {
    border-radius: 50%;
    background: #18080a;
    box-shadow: 0 12px 28px rgba(139, 26, 40, 0.65), 0 0 18px rgba(237, 28, 36, 0.35);
  }
  #cookie.skin-shushik-3d .layer.shushik-upper-rim,
  #cookie.skin-shushik-3d .layer.shushik-lower-rim {
    background-color: #1c0c09;
    background-image: var(--shushik-sidewall-tex, url('assets/skins/shushik_tap_cookie_sidewall.png'));
    background-position: center center;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    border: 1px solid rgba(92, 42, 32, 0.45);
  }
  #cookie.skin-shushik-3d .layer.shushik-ruby-interlayer {
    background-color: #8B1A28;
    background-image: var(--shushik-interlayer-tex, url('assets/skins/shushik_tap_cookie_interlayer.png'));
    background-position: center center;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    border: 1px solid rgba(237, 28, 36, 0.55);
  }
  #cookie.skin-shushik-3d .layer.top {
    background: transparent !important;
    overflow: hidden;
  }
  .shushik-top-cookie-img {
    width: 100%; height: 100%; display: block; object-fit: contain;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .shushik-mini-wrap {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; filter: drop-shadow(0 6px 14px rgba(139, 26, 40, 0.6));
  }
  .shushik-mini-cookie {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  .shushik-mini-badge {
    position: absolute; right: -4px; bottom: -4px; object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85)); pointer-events: none;
  }
  .shushik-hud-star {
    width: 24px; height: 24px; object-fit: contain; display: block;
    filter: drop-shadow(0 2px 6px rgba(237, 28, 36, 0.75));
  }

  .pop {
    position: fixed; z-index: 15; pointer-events: none; font-weight: 900;
    font-size: clamp(26px, 6.5vmin, 46px); color: #fff;
    text-shadow: 0 3px 0 #5a6cff, 0 6px 18px rgba(80,110,255,.8);
    will-change: transform, opacity;
  }
  .pop.shushik-pop {
    color: #F0EAD6;
    text-shadow: 0 3px 0 #8B1A28, 0 0 14px #ED1C24, 0 6px 22px rgba(139, 26, 40, 0.92);
  }
  .pop.shushik-pop.crit {
    color: #ED1C24;
    text-shadow: 0 3px 0 #8B1A28, 0 0 18px #F0EAD6, 0 8px 26px rgba(237, 28, 36, 0.96);
  }
  .spark {
    position: fixed; z-index: 14; pointer-events: none; width: 8px; height: 8px; border-radius: 50%;
    background: #fff4d6; box-shadow: 0 0 8px #fff4d6; will-change: transform, opacity;
  }

  /* Нижнее меню (поднято над подвалом, чтобы плашка Netlify ничего не закрывала) */
  .footer-strip {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--foot); z-index: 24;
    display: flex; align-items: center; padding: 0 16px;
    background: linear-gradient(180deg, rgba(7,9,25,0), rgba(7,9,25,.96) 55%);
    font-weight: 900; letter-spacing: 2px; font-size: 13px; color: rgba(255,255,255,.35); pointer-events: none;
  }
  .bottom-nav {
    position: fixed; left: 10px; right: 10px; bottom: calc(var(--foot) + 4px); z-index: 25;
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    max-width: 600px; margin: 0 auto;
    padding: 6px; border-radius: 22px;
    background: rgba(14, 18, 46, .94); border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(12px); box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  .nav-btn {
    border: 0; background: transparent; color: rgba(255,255,255,.7);
    padding: 7px 0 5px; border-radius: 16px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font: 800 10px inherit; position: relative; transition: background .18s, color .18s, transform .12s;
  }
  .nav-btn i { font-style: normal; font-size: 24px; line-height: 1; }
  .nav-btn:active { transform: scale(.92); }
  .nav-btn.active { background: rgba(255,215,106,.18); color: #ffd76a; }
  .nav-badge {
    position: absolute; top: 2px; right: 8px; min-width: 16px; height: 16px;
    padding: 0 4px; border-radius: 99px; background: #ff3b5c; color: #fff;
    font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center;
  }

  /* Выдвижная панель (Drawer) для разделов */
  #drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
    max-height: 80vh; overflow-y: auto;
    padding: 16px 14px 80px; border-radius: 26px 26px 0 0;
    background: rgba(14, 18, 46, .97); border-top: 1px solid rgba(255,255,255,.18);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.3,1);
    backdrop-filter: blur(14px);
  }
  #drawer.open { transform: none; }
  .drawer-head {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 540px; margin: 0 auto 14px; font-weight: 900; font-size: 19px;
  }
  .drawer-head button {
    border: 0; background: rgba(255,255,255,.12); color: #fff;
    width: 34px; height: 34px; border-radius: 50%; font-size: 17px; cursor: pointer;
  }
  .drawer-body { max-width: 540px; margin: 0 auto; }

  /* Карточки элементов внутри панели */
  .card {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px; padding: 12px 14px; border-radius: 16px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    transition: transform .12s, background .2s, border-color .2s;
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:active { transform: scale(.98); }
  .card.gold-border { border-color: rgba(255,215,106,.55); background: linear-gradient(135deg, rgba(255,205,70,.13), rgba(255,140,30,.06)); }
  .card.no { opacity: .48; }
  .card .ic { font-size: 28px; width: 42px; text-align: center; flex-shrink: 0; }
  .card .tx { flex: 1; min-width: 0; }
  .card .tx b { display: block; font-size: 15px; margin-bottom: 2px; }
  .card .tx span { display: block; font-size: 12.5px; opacity: .72; line-height: 1.35; }
  .card .act {
    font-weight: 800; font-size: 13px; color: #1b1400;
    background: linear-gradient(180deg, #ffe58a, #ffb830);
    padding: 8px 13px; border-radius: 12px; border: 0; cursor: pointer; white-space: nowrap;
  }
  .card .act.secondary {
    background: rgba(255,255,255,.14); color: #fff;
  }
  .card .act.free {
    background: linear-gradient(180deg, #69f0ae, #00c853); color: #04210f;
  }

  .section-title {
    font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: #9fb4ff; margin: 16px 0 8px;
  }

  /* Шкала Duolingo-стрика */
  .streak-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0 14px;
  }
  .streak-day {
    padding: 8px 4px; border-radius: 12px; text-align: center;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    font-size: 11px; font-weight: 700;
  }
  .streak-day.done {
    background: linear-gradient(180deg, rgba(255,140,30,.35), rgba(255,80,20,.2));
    border-color: #ff9838; color: #ffe08a;
  }
  .streak-day.today {
    border: 2px solid #ffd76a; box-shadow: 0 0 12px rgba(255,215,106,.35);
  }
  .streak-day i { display: block; font-style: normal; font-size: 16px; margin-bottom: 3px; }

  /* Сетка скинов */
  .skin-badge {
    display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 800;
    margin-left: 6px; vertical-align: middle;
  }
  .rarity-common { background: rgba(255,255,255,.15); color: #fff; }
  .rarity-rare { background: rgba(64,196,255,.25); color: #80d8ff; }
  .rarity-epic { background: rgba(213,0,249,.28); color: #ea80fc; }
  .rarity-legend { background: rgba(255,215,64,.3); color: #ffd740; }
  .rarity-mythic { background: linear-gradient(90deg, #ff4081, #7c4dff); color: #fff; }

  /* Поле реферальной ссылки */
  .ref-box {
    background: rgba(0,0,0,.35); border: 1px dashed rgba(255,215,106,.5);
    border-radius: 14px; padding: 12px; margin-bottom: 12px;
  }
  .ref-url {
    font-family: monospace; font-size: 12.5px; color: #ffe58a;
    word-break: break-all; padding: 8px 10px; background: rgba(255,255,255,.06);
    border-radius: 8px; margin: 6px 0 10px; user-select: text; -webkit-user-select: text;
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row button { flex: 1; min-width: 130px; }

  /* Модальное окно (Закончилась энергия / Выпадение из кейса / Сгорел стрик) */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(5, 8, 22, .84); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 16px 16px 64px;
  }
  .modal-backdrop.show { display: flex; }
  .modal-card {
    width: 100%; max-width: 400px; border-radius: 24px; padding: 22px 18px;
    background: linear-gradient(180deg, #1d2559, #101538);
    border: 1px solid rgba(255,215,106,.4); text-align: center;
    box-shadow: 0 16px 50px rgba(0,0,0,.65);
  }
  .modal-card h3 { margin: 6px 0 8px; font-size: 22px; }
  .modal-card p { margin: 0 0 16px; font-size: 14px; opacity: .85; line-height: 1.45; }
  .modal-btn {
    display: block; width: 100%; padding: 12px 16px; margin-bottom: 8px;
    border-radius: 14px; border: 0; font: 800 14px inherit; cursor: pointer;
  }
  .modal-btn.primary {
    background: linear-gradient(180deg, #ffe58a, #ffb300); color: #1a1200;
  }
  .modal-btn.ad {
    background: linear-gradient(180deg, #69f0ae, #00c853); color: #052210;
  }
  .modal-btn.ghost {
    background: rgba(255,255,255,.1); color: #fff;
  }

  .toast {
    position: fixed; left: 50%; top: 18%; z-index: 70; transform: translateX(-50%); pointer-events: none;
    font-size: clamp(18px, 4.5vmin, 30px); font-weight: 900; text-align: center;
    padding: 8px 18px; border-radius: 99px; background: rgba(12,16,40,.9);
    border: 1px solid rgba(255,215,106,.45);
    text-shadow: 0 3px 14px rgba(255,215,106,.6); color: #ffe58a;
  }
  .flash { position: fixed; inset: 0; z-index: 34; pointer-events: none; background: #fff; mix-blend-mode: overlay; }

  /* ===== Вкладки: общие элементы ===== */
  .wallet { display: flex; gap: 8px; margin-bottom: 12px; }
  .w-chip { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 14px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); font-size: 17px; }
  .w-chip b { font-weight: 900; }
  .w-chip.gem { color: #7ce8ff; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sec { font-size: 13px; font-weight: 900; letter-spacing: 1px; color: #9fb4ff; margin: 14px 2px 8px; }
  .pips { flex: 1; width: 100%; height: 7px; border-radius: 9px; background: rgba(255,255,255,.14); overflow: hidden; }
  .pips i { display: block; height: 100%; background: linear-gradient(90deg, #6f8cff, #ffd76a); border-radius: 9px; transition: width .3s; }
  .pips.big { height: 10px; }
  .seg { display: flex; padding: 4px; border-radius: 16px; background: rgba(255,255,255,.07); margin-bottom: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; color: rgba(255,255,255,.7); padding: 10px; border-radius: 12px; font: 800 14px inherit; cursor: pointer; }
  .seg button.on { background: linear-gradient(180deg, #ffe58a, #ffb830); color: #1b1400; }
  .seg .cnt { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 99px; background: rgba(0,0,0,.28); color: #fff; font-size: 12px; }

  /* Плитки (прокачка, магазин) */
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 16px 8px 10px; border-radius: 20px; cursor: pointer; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.13); transition: transform .12s; }
  .tile:active { transform: scale(.96); }
  .tile .t-ic { font-size: 38px; line-height: 1; }
  .tile b { font-size: 13.5px; }
  .tile small { font-size: 11.5px; opacity: .72; min-height: 14px; }
  .tile .t-btn { margin-top: 2px; width: 100%; padding: 8px 6px; border-radius: 12px; font-weight: 900; font-size: 13px; background: linear-gradient(180deg, #ffe58a, #ffb830); color: #1b1400; }
  .tile.no { opacity: .6; }
  .tile.no .t-btn { background: rgba(255,255,255,.14); color: #fff; }

  // Кейсы со скинами печенек и их экономика (хардкорные шансы в бесплатных, высокие — в донатном VIP)
  const CASES = [
    {
      id: 'free_starter',
      name: '🎁 Стартовый Бесплатный Кейс',
      desc: 'Бесплатный кейс раз в 24 часа. Выбить Золотой ОРЕО почти нереально (0.05%), но вдруг повезёт?',
      priceCoins: 0, priceGems: 0, isFreeType: 'daily',

        { skin: 'classic', chance: 84 },

        { skin: 'mint', chance: 3 },
        { skin: 'neon67', chance: 0.45 },

    },
    {

      priceCoins: 0, priceGems: 0, isFreeType: 'activity',

    {

      desc: 'Базовый кейс за натапанные печенько-коины. Шанс на топ-скины минимален, зато доступен за тапы!',
      priceCoins: 25000, priceGems: 0,

        { skin: 'classic', chance: 58 },

    },
    {

      desc: 'Элитный кейс ТОЛЬКО за Кристаллы 💎! Никаких обычных печенек и повышенный шанс на Золотой ОРЕО и Диму Твикса!',
      priceCoins: 0, priceGems: 25,

      desc: 'Самый элитарный кейс ОРЕО за Кристаллы 💎! Только здесь 45% суммарный шанс выбить Золотой ОРЕО или Диму Твикса!',
      priceCoins: 0, priceGems: 65,
      drops: [
        { skin: 'mint', chance: 18 },
        { skin: 'neon67', chance: 37 },
        { skin: 'gold', chance: 33 },
        { skin: 'twix', chance: 12 }
      ]
    }
  ];

  // ---------- НАСТРОЙКИ ОБЛАЧНОЙ БАЗЫ И РЕЛИЗА ----------
  const OREO_CONFIG = {
    FIREBASE_DB_URL: 'https://oreo-tap-default-rtdb.europe-west1.firebasedatabase.app/',
    BACKEND_API_URL: 'https://oreo-tap.onrender.com/api/bot',
    RELEASE_MODE: false,
    RELEASE_SEASON_ID: 1,
    ECONOMY_VERSION: 3, // Экономика v3: воодушевляющие целые числа + быстрый авто-дрон + прогрессивные цены
    SHOW_FAKE_BOTS: false
  };

  // ---------- СОСТОЯНИЕ ИГРОКА И СОХРАНЕНИЕ ----------
  const SAVE_KEY = 'oreo-tap-save-v2';
  const legacyRaw = localStorage.getItem('oreo-tap-save-v1');
  const savedRaw = localStorage.getItem(SAVE_KEY) || legacyRaw || '{}';
  let loaded = {};
  try { loaded = JSON.parse(savedRaw); } catch (e) {}

  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };

  const defaultState = {
    count: 0,
    coins: 0,
    gems: 5,  // стартовые ОРЕО-кристаллы
    lv: { power: 0, auto: 0, crit: 0, critx: 0, combo: 0, energyMax: 0 },
    equippedSkin: 'classic',
    inventory: { classic: 1 },
    freeStarterClaimedDate: '',
    freeActivityClaimedDate: '',
    energy: 500,
    lastEnergyTs: Date.now(),
    energyEmptySince: 0,
    streakDays: 1,
    lastLoginDate: '',
    streakShields: 0,
    dailyDate: '',
    dailyTaps: 0,
    dailyMaxCombo: 0,
    dailyCasesOpened: 0,
    dailyCamMusicTaps: 0,
    dailyRefShared: false,
    dailyGemsExchanged: 0,
    claimedQuests: {},
    referralsCount: 0,
    refPassiveEarned: 0,
    referredBy: '',
    vipUnlimitedEnergy: false,
    boostUntil: 0,
    marketVolume: 0,
    demoUsed: false,
    demoCoinsTaken: 0,
    demoGemsTaken: 0,
    wheelSpunDate: '',
    economyVersion: 3,
    gemsWipeDone: 1,
    releaseWipeDone: 0,
    ownedTracks: ['tap_lofi'],
    ownedTrackMeta: {}
  };

  // Переход на экономику v3 (возврат больших красивых целых чисел вместо дробных 1.5379 из v2):
  if (loaded && (loaded.economyVersion || 0) < OREO_CONFIG.ECONOMY_VERSION) {
    const earlyUid = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user && Telegram.WebApp.initDataUnsafe.user.id)
      ? String(Telegram.WebApp.initDataUnsafe.user.id)
      : (localStorage.getItem('oreo_anon_id') || '');
    let rawCoins = Math.max(0, Number(loaded.coins) || Number(loaded.count) || 0);
    let rawCount = Math.max(rawCoins, Number(loaded.count) || 0);
    if (loaded.economyVersion === 2 || (rawCoins > 0 && rawCoins < 10000)) {
      rawCoins = Math.round(rawCoins * 10000000);
      rawCount = Math.round(rawCount * 10000000);
    } else if (earlyUid === '481293676' && rawCoins > 50000000) {
      rawCoins = rawCoins - 50000000;
      rawCount = Math.max(rawCoins, rawCount - 50000000);
    }
    loaded.coins = roundCoin(rawCoins);
    loaded.count = roundCoin(rawCount);
    loaded.economyVersion = OREO_CONFIG.ECONOMY_VERSION;
    loaded.gemsWipeDone = 1;
  }

  // Списание бесплатно накликанных тестовых кристаллов (из старой кнопки «Магнат ОРЕО тест»)
  if (loaded && (loaded.gemsWipeDone || 0) < 1) {
    if (loaded.demoUsed || (Number(loaded.gems) || 0) > 15) {
      loaded.gems = 5;
      loaded.vipUnlimitedEnergy = false;
      loaded.demoUsed = false;
      loaded.demoGemsTaken = 0;
    }
    loaded.gemsWipeDone = 1;
  }

  const VIP_FOUNDERS = ['594228143', '481293676', '1582574743']; // Павел, Денис, Вика
  const PAVEL_ID = '594228143';
  const DENIS_ID = '481293676';
  const VIKA_ID = '1582574743';
  const PAVEL_BANK_DEFAULT = 433763254656000000; // Баланс Павла, отправленный в Общий банк призового фонда
  const DENIS_RESTORE_COINS = 2000000000; // 2 миллиарда коинов возврата Денису

  // Проверка избранных игроков с бесконечной энергией (Viiiii, Аня🤍, Какоина) + основатели
  function isUnlimitedEnergyUser(uid, uname) {
    const idStr = String(uid || '');
    const n = String(uname || '').trim().toLowerCase();
    if (VIP_FOUNDERS.includes(idStr)) return true;
    if (n === 'viiiii' || n.startsWith('viiiii') || n.includes('аня') || n.includes('какоина')) return true;
    return false;
  }

  const state = Object.assign({}, defaultState, loaded);
  state.lv = Object.assign({}, defaultState.lv, state.lv);
  state.inventory = Object.assign({ classic: 1 }, state.inventory);
  state.claimedQuests = state.claimedQuests || {};
  const initTgUser = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user)
    ? window.Telegram.WebApp.initDataUnsafe.user : null;
  const initTgUid = (initTgUser && initTgUser.id) ? String(initTgUser.id) : '';
  const initTgName = (initTgUser && initTgUser.first_name) ? String(initTgUser.first_name) : '';

  // Если вдруг на клиенте остался дробный баланс (< 10000 у основателей, кроме Павла), поднимаем до целых миллионов
  if (VIP_FOUNDERS.includes(initTgUid) && initTgUid !== PAVEL_ID && state.coins > 0 && state.coins < 10000) {
    state.coins = roundCoin(state.coins * 10000000);
    state.count = roundCoin(Math.max(state.coins, (Number(state.count) || 0) * 10000000));
  }
  // Персональный подарок для Вики (Viiiii, id 1582574743) от Павла: 10 000 000 коинов!
  if (initTgUid === VIKA_ID && ((state.giftFromPavel || 0) < 2 || state.coins < 10000000)) {
    state.coins = roundCoin(Math.max(10000000, Number(state.coins) || 0));
    state.count = roundCoin(Math.max(state.coins, Number(state.count) || 0));
    state.giftFromPavel = 2;
    setTimeout(() => showToast('🎁 Подарок от Павла: 10 000 000 🪙!'), 900);
  }
  // Выдача всем троим (Павел, Денис, Вика) максимальных бустов и 50 000 💎 кристаллов
  if (VIP_FOUNDERS.includes(initTgUid)) {
    state.lv = { power: 25, auto: 15, crit: 15, critx: 10, combo: 10, energyMax: 15 };
    state.vipUnlimitedEnergy = true;
    state.energy = 2750;
    if ((state.founderGrantId || 0) < 1) {
      state.gems = 50000;
      state.founderGrantId = 1;
      setTimeout(() => showToast('👑 VIP-бонус основателя: ВСЕ бусты MAX + 50 000 💎!'), 1200);
    } else if ((state.gems || 0) < 1000) {
      state.gems = 50000;
    }
  }

  // 1) Бесконечная энергия для Viiiii, Аня🤍 и Какоина
  if (isUnlimitedEnergyUser(initTgUid, initTgName)) {
    state.vipUnlimitedEnergy = true;
    state.energy = Math.max(state.energy || 500, 500 + (state.lv.energyMax || 0) * 150);
  }

  // 2) Возврат Денису 2 000 000 000 (2 миллиарда) коинов
  if (initTgUid === DENIS_ID || initTgName.trim().toLowerCase() === 'denis') {
    if ((state.denisRefund2B || 0) < 1 || state.coins < DENIS_RESTORE_COINS) {
      state.coins = DENIS_RESTORE_COINS;
      state.count = DENIS_RESTORE_COINS;
      state.denisRefund2B = 1;
      setTimeout(() => showToast('👑 Возвращено 2 000 000 000 🪙 на баланс!'), 900);
    }
  }

  // 3) Перевод всех коинов Павла в Общий банк (призовой фонд) и исключение из гонки за рейтингом
  if (initTgUid === PAVEL_ID) {
    if ((state.pavelMovedToBank || 0) < 1 || state.coins > 0) {
      const movedAmount = Math.max(state.coins || 0, state.count || 0, PAVEL_BANK_DEFAULT);
      state.bankContribution = movedAmount;
      state.coins = 0;
      state.count = 0;
      state.pavelMovedToBank = 1;
      setTimeout(() => showToast('🏦 Все твои коины переведены в Общий Банк ивентов!'), 900);
    }
  }

  state.coins = roundCoin(state.coins);
  let count = roundCoin(state.count);

  // Очистка тестовой халявы при переходе в РЕЛИЗ (сохраняет честные тапы, уровень и стрик!)
  if (OREO_CONFIG.RELEASE_MODE && state.releaseWipeDone < OREO_CONFIG.RELEASE_SEASON_ID) {
    const honestTaps = Math.max(0, count);
    state.coins = roundCoin(Math.min(state.coins, honestTaps * 1.2 + 500));
    if (state.demoUsed) {
      state.gems = 0;
      state.vipUnlimitedEnergy = false;
      state.boostUntil = 0;
      state.lv = { power: 0, auto: 0, crit: 0, critx: 0, combo: 0, energyMax: 0 };
      state.inventory = { classic: 1 };
      state.equippedSkin = 'classic';
      state.coins = roundCoin(honestTaps);
    }
    state.demoUsed = false;
    state.demoCoinsTaken = 0;
    state.demoGemsTaken = 0;
    state.releaseWipeDone = OREO_CONFIG.RELEASE_SEASON_ID;
  }

  // ---------- ПРОВЕРКА ЕЖЕДНЕВНОГО СТРИКА (КАК В DUOLINGO: ПРОПУСК = СГОРАНИЕ ПРОГРЕССА) ----------
  function checkDailyStreakAndReset() {
    const today = todayStr();
    if (state.dailyDate !== today) {
      state.dailyDate = today;
      state.dailyTaps = 0;
      state.dailyMaxCombo = 0;
      state.dailyCasesOpened = 0;
      state.dailyCamMusicTaps = 0;
      state.dailyRefShared = false;
      state.dailyGemsExchanged = 0;
      state.claimedQuests = {};
    }

    if (!state.lastLoginDate) {
      state.lastLoginDate = today;
      state.streakDays = Math.max(1, state.streakDays || 1);
      return;
    }
    if (state.lastLoginDate === today) return;

    const prev = new Date(state.lastLoginDate + 'T00:00:00');
    const curr = new Date(today + 'T00:00:00');
    const diffDays = Math.round((curr - prev) / 86400000);

    if (diffDays === 1) {
      state.streakDays = (state.streakDays || 1) + 1;
      state.lastLoginDate = today;
      const bonus = roundCoin(state.streakDays * 1500);
      state.coins = roundCoin(state.coins + bonus);
      setTimeout(() => showToast(`🔥 День ${state.streakDays} подряд! +${fmt(bonus)} 🪙`), 600);
    } else if (diffDays > 1) {
      if (state.streakShields > 0) {
        state.streakShields--;
        state.lastLoginDate = today;
        setTimeout(() => showToast('🧊 Заморозка спасла твой стрик и прогресс от сгорания!'), 600);
      } else {
        // Жёсткое правило Duolingo-ОРЕО: не заходишь — прогресс и стрик сгорают!
        count = 0;
        state.count = 0;
        state.coins = 0;
        state.lv = { power: 0, auto: 0, crit: 0, critx: 0, combo: 0, energyMax: 0 };
        state.streakDays = 1;
        state.lastLoginDate = today;
        setTimeout(() => {
          showModal(`
            <div style="font-size:48px">💀🔥</div>
            <h3>Прогресс сгорел!</h3>
            <p>Ты пропустил день входа в <b>ОРЕО</b>! По правилам ударного режима без заморозки весь прогресс тапов и коинов сгорел до нуля.<br><br>Заходи каждый день и держи стрик!</p>
            <button class="modal-btn primary" onclick="window._closeOreoModal()">Понял, начинаю новый разгон! 🍪</button>
          `);
        }, 500);
      }
    }
  }
  checkDailyStreakAndReset();

  // ---------- 3D ПЕЧЕНЬКА С ПОДДЕРЖКОЙ СКИНОВ (ОПТИМИЗИРОВАННЫЙ 60 FPS СТЕК) ----------
  const SHUSHIK_SKIN_TEXTURES = [
    'assets/skins/shushik_tap_cookie.png',
    'assets/skins/shushik_tap_cookie_sidewall.png',
    'assets/skins/shushik_tap_cookie_interlayer.png',
    'assets/skins/shushik_badge_star.png',
    'assets/skins/shushik_token_chip.png'
  ];
  let _shushikTopDataUrl = 'assets/skins/shushik_tap_cookie.png';

  function prescaleTextureToWebp(img, size, isRimStrip, coreColor) {
    try {
      const cvs = document.createElement('canvas');
      cvs.width = size;
      cvs.height = size;
      const ctx = cvs.getContext('2d');
      if (!ctx) return '';
      if (isRimStrip) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
        ctx.clip();
        const stripH = Math.max(24, Math.round(size * 0.22));
        for (let y = 0; y < size; y += stripH) {
          ctx.drawImage(img, 0, y, size, stripH + 1);
        }
        const grad = ctx.createRadialGradient(size / 2, size * 0.44, size * 0.08, size / 2, size / 2, size * 0.48);
        grad.addColorStop(0, coreColor);
        grad.addColorStop(0.68, coreColor);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);
        ctx.restore();
      } else {
        ctx.drawImage(img, 0, 0, size, size);
      }
      return cvs.toDataURL('image/webp', 0.85);
    } catch (_) {
      return '';
    }
  }

  const _preloadedSkinImages = SHUSHIK_SKIN_TEXTURES.map(src => {
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => {
      if (src.endsWith('shushik_tap_cookie.png')) {
        const url = prescaleTextureToWebp(img, 420, false, '');
        if (url) {
          _shushikTopDataUrl = url;
          const topImg = cookie.querySelector('.shushik-top-cookie-img');
          if (topImg) topImg.src = url;
        }
      } else if (src.endsWith('shushik_tap_cookie_sidewall.png')) {
        const url = prescaleTextureToWebp(img, 256, true, 'rgba(28, 12, 9, 0.92)');
        if (url) cookie.style.setProperty('--shushik-sidewall-tex', `url("${url}")`);
      } else if (src.endsWith('shushik_tap_cookie_interlayer.png')) {
        const url = prescaleTextureToWebp(img, 256, true, 'rgba(110, 14, 28, 0.88)');
        if (url) cookie.style.setProperty('--shushik-interlayer-tex', `url("${url}")`);
      }
    };
    img.src = src;
    return img;
  });

  // Стек из 9 композитных 3D-слоёв с увеличенным Z-шагом (сохраняет полную толщину печеньки при 60 FPS)
  const STEP = 8.5;
  const LOWER_WAFER = 2;
  const CREAM = 3;
  const UPPER_WAFER = 3;
  const waferEls = [];
  const creamEls = [];
  let topLayerEl = null;

  function makeTopSVG(sk) {
    if (sk && sk.id === 'shushik') {
      return `<img class="shushik-top-cookie-img" src="${_shushikTopDataUrl}" alt="Шушик" draggable="false">`;
    }
    if (sk && sk.customSvg) return sk.customSvg;
    return `
    <svg viewBox="0 0 200 200">
      <defs>
        <radialGradient id="gSkin" cx="40%" cy="35%" r="75%">
          <stop offset="0" stop-color="${sk.svgStop1}"/><stop offset="1" stop-color="${sk.svgStop2}"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="100" fill="url(#gSkin)"/>
      <circle cx="100" cy="100" r="90" fill="none" stroke="#150a06" stroke-width="3"/>
      <circle cx="100" cy="100" r="86" fill="none" stroke="${sk.stroke}" stroke-width="1.6" opacity=".8"/>

    const dt = Math.min(.033, (now - t0) / 1000); t0 = now;
    [tiltX, tiltY, scale, spin, press].forEach(s => step(s, dt));
    const time = now / 1000;
    const floatY = Math.sin(time * 1.6) * 8;
    const idleRX = Math.sin(time * 1.1) * 2.5;
    const idleRZ = Math.cos(time * .9) * 3;

            choppedLogs: curChopped,
            skin: curSkin,
            equippedSkin: curSkin,
            wallet: {
              coins: myScore,
              gems: curGems,
              energy: curEnergy,
              sticks: curSticks,
              choppedLogs: curChopped,
              equippedSkin: curSkin
            },
            streak: state.streakDays || 1,
            demoUsed: Boolean(state.demoUsed),
            economyVersion: OREO_CONFIG.ECONOMY_VERSION,
            giftFromPavel: state.giftFromPavel || 0,
            denisRefund2B: state.denisRefund2B || 0,
            pavelMovedToBank: state.pavelMovedToBank || 0,
            excludedFromLeaderboard: isPavel,
            vipUnlimitedEnergy: Boolean(state.vipUnlimitedEnergy),
            releaseWipeDone: state.releaseWipeDone || 0,
            adminResetId: state.adminResetId || 0,
            lastSeen: nowTs,
            ts: nowTs
          })
        });
      }
      const res = await fetch(`${db}/players.json`);
      if (res.ok) {
        const data = await res.json();
        if (data && typeof data === 'object') {
          const pavelEntry = data[PAVEL_ID];
          const denisEntry = data[DENIS_ID];

          // Однократная синхронизация в облаке: перенос коинов Павла в Общий банк и возврат 2 млрд Денису
          if (!bankMigrationSynced) {
            bankMigrationSynced = true;
            const pavelCloudCoins = pavelEntry && Number(pavelEntry.coins) > 0 ? Number(pavelEntry.coins) : PAVEL_BANK_DEFAULT;
            commonBankTotal = Math.max(PAVEL_BANK_DEFAULT, pavelCloudCoins);

            if (pavelEntry && (Number(pavelEntry.coins) > 0 || !pavelEntry.excludedFromLeaderboard)) {
              fetch(`${db}/players/${PAVEL_ID}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ coins: 0, taps: 0, pavelMovedToBank: 1, excludedFromLeaderboard: true })
              }).catch(() => {});
              fetch(`${db}/common_bank.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ coins: commonBankTotal, sponsor: 'Pavel', updatedAt: Date.now() })
              }).catch(() => {});
            }

            if (denisEntry && ((denisEntry.denisRefund2B || 0) < 1 || Number(denisEntry.coins) < DENIS_RESTORE_COINS)) {
              fetch(`${db}/players/${DENIS_ID}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ coins: DENIS_RESTORE_COINS, taps: DENIS_RESTORE_COINS, denisRefund2B: 1, economyVersion: OREO_CONFIG.ECONOMY_VERSION })
              }).catch(() => {});
              denisEntry.coins = DENIS_RESTORE_COINS;
              denisEntry.denisRefund2B = 1;
            }
          }

          const myCloudEntry = data[String(playerId)];
          if (myCloudEntry && myCloudEntry.ownedTracks) {
            const cOwned = Array.isArray(myCloudEntry.ownedTracks)
              ? myCloudEntry.ownedTracks
              : Object.values(myCloudEntry.ownedTracks);
            const curOwned = Array.isArray(state.ownedTracks) ? state.ownedTracks : ['tap_lofi'];
            const mergedOwned = Array.from(new Set(['tap_lofi', ...curOwned, ...cOwned.map(String)]));
            state.ownedTracks = mergedOwned;
            if (myCloudEntry.ownedTrackMeta && typeof myCloudEntry.ownedTrackMeta === 'object') {
              state.ownedTrackMeta = Object.assign({}, state.ownedTrackMeta || {}, myCloudEntry.ownedTrackMeta);
            }
          }

          cloudPlayers = Object.values(data).filter(p => p && p.id && String(p.id) !== String(playerId) && String(p.id) !== PAVEL_ID);
          refreshHud();
          if (activeTab === 'leaderboard') renderCurrentTab();
        }
      }
    } catch (e) {}
  }

  function getLeaderboardData() {
    const list = [];
    if (OREO_CONFIG.SHOW_FAKE_BOTS && !OREO_CONFIG.RELEASE_MODE) {
      BOTS_LEADERBOARD.forEach(b => {
        list.push({
          id: '',
          photo: '',
          name: b.name,
          coins: b.baseCoins,
          skin: b.skin,
          isMe: false
        });
      });
    }
    cloudPlayers.forEach(p => {
      // Павел перевёл все средства в Общий банк и не участвует в гонке за рейтингом
      if (String(p.id) === PAVEL_ID || p.excludedFromLeaderboard) return;

      let pCoins = Number(p.coins) || 0;
      if (String(p.id) === DENIS_ID && pCoins < DENIS_RESTORE_COINS) {
        pCoins = DENIS_RESTORE_COINS;
      } else if (p.economyVersion === 2 || (pCoins > 0 && pCoins < 1000 && !Number.isInteger(pCoins))) {
        pCoins = roundCoin(pCoins * 10000000);
      } else {
        pCoins = roundCoin(pCoins);
      }
      let pSkin = SKINS[p.skin] ? p.skin : 'classic';
      if (OREO_CONFIG.RELEASE_MODE && (p.releaseWipeDone || 0) < OREO_CONFIG.RELEASE_SEASON_ID) {
        const honestTaps = Math.max(0, Number(p.taps) || 0);
        pCoins = roundCoin(Math.min(pCoins, honestTaps * 1.2 + 500));
        if (p.demoUsed) pSkin = 'classic';
      }
      list.push({
        id: String(p.id || ''),
        photo: p.photo || '',
        name: p.name || 'Тапер ОРЕО',
        coins: pCoins,
        skin: pSkin,
        isMe: false
      });
    });
    // Павел исключён из рейтинговой таблицы (он спонсор Общего банка)
    if (String(playerId) !== PAVEL_ID) {
      list.push({
        id: playerId,
        photo: playerPhoto || '',
        name: `${playerName} (Ты)`,
        coins: roundCoin(Math.max(state.coins, count)),
        skin: state.equippedSkin,
        isMe: true
      });
    }
    list.sort((a, b) => b.coins - a.coins);
    return list;
  }

  // ---------- СОХРАНЕНИЕ И ОБНОВЛЕНИЕ HUD ----------
  function save() {
    state.coins = roundCoin(state.coins);
    count = roundCoin(count);
    state.count = count;
    state.lastEnergyTs = Date.now();
    const json = JSON.stringify(state);
    localStorage.setItem(SAVE_KEY, json);
    try { tg && tg.CloudStorage && tg.CloudStorage.setItem(SAVE_KEY, json); } catch (e) {}
    syncCloudLeaderboard();
  }

  const toCrumbs = c => Math.max(0, Math.floor(Number(c) || 0));
  const tierOf = c => Math.max(2, Math.floor(Math.log10(Math.max(1, toCrumbs(c)))));
  const stepOf = c => Math.pow(10, tierOf(c));
  const eventsAt = c => {
    const cr = toCrumbs(c);
    return cr < 100 ? 0 : 9 * (tierOf(c) - 2) + Math.floor(cr / stepOf(c));
  };

  function countAvailableFreeCases() {
    const today = todayStr();
    let free = 0;
    if (state.freeStarterClaimedDate !== today) free++;
    if (state.freeActivityClaimedDate !== today && state.dailyTaps >= 250) free++;
    return free;
  }

  function countReadyQuests() {
    let ready = 0;
    DAILY_QUESTS.forEach(q => {
      if (!state.claimedQuests[q.id] && q.progress() >= q.target) ready++;
    });
    return ready;
  }

  function refreshHud() {
    countEl.textContent = fmt(state.coins);
    $('coins').textContent = fmt(state.coins);
    $('gems').textContent = fmtInt(state.gems);
    $('pw').textContent = fmt(tapPower());
    $('aps').textContent = fmt(autoCoinPerSec());
    $('streakCountTop').textContent = state.streakDays;

    const lvl = eventsAt(count) + 1;
    $('lvl').textContent = lvl;
    const cr = toCrumbs(count);
    const st = stepOf(count);
    $('barFill').style.width = ((cr % st) / st * 100) + '%';

    const maxE = maxEnergy();
    if (isUnlimitedEnergyUser(playerId, playerName)) state.vipUnlimitedEnergy = true;

    if (state.vipUnlimitedEnergy) {
      $('energyTxt').textContent = '∞ VIP';
      $('energyFill').style.width = '100%';
    } else if (state.energy < 1 && state.energyEmptySince > 0) {
      const remMs = Math.max(0, ENERGY_REFILL_DURATION_MS - (Date.now() - state.energyEmptySince));
      const remMin = Math.ceil(remMs / 60000);
      $('energyTxt').textContent = `0/${maxE} (⏳ ${remMin}м)`;
      $('energyFill').style.width = '0%';
    } else {
      $('energyTxt').textContent = `${Math.floor(state.energy)}/${maxE}`;
      $('energyFill').style.width = Math.min(100, (state.energy / maxE) * 100) + '%';
    }

    const lb = getLeaderboardData();
    const myIdx = lb.findIndex(x => x.isMe);
    const lg = getLeague(Math.max(state.coins, count));
    $('leagueBadge').textContent = String(playerId) === PAVEL_ID ? '🏦 Основатель Банка' : lg.name;
    $('rankTxt').textContent = String(playerId) === PAVEL_ID ? '👑 Вне гонки' : (myIdx >= 0 ? `🏆 #${myIdx + 1}` : '🏆 #—');

    const freeC = countAvailableFreeCases();
    $('freeCaseBadge').style.display = freeC > 0 ? 'flex' : 'none';
    $('freeCaseBadge').textContent = freeC;

    const rq = countReadyQuests();
    $('questBadge').style.display = rq > 0 ? 'flex' : 'none';
    $('questBadge').textContent = rq > 0 ? rq : '!';

    if (Date.now() < state.boostUntil) {
      const sec = Math.ceil((state.boostUntil - Date.now()) / 1000);
      $('boostChip').style.display = 'inline-block';
      $('boostChip').textContent = `🚀 ×2 · ${sec}с`;
    } else {
      $('boostChip').style.display = 'none';
    }
  }

  // ---------- ЗВУКИ И ЭФФЕКТ УРОВНЯ (БЕЗ ГАЗАНА — АНТИ-АП) ----------
  const voice = new Audio('assets/67.mp3');
  voice.preload = 'auto';
  function say67(times = 1) {
    if (isAnyMiniOverlayOpen()) return;
    for (let k = 0; k < times; k++) setTimeout(() => {
      if (isAnyMiniOverlayOpen()) return;
      try { const a = voice.cloneNode(); a.volume = 0.9; a.play().catch(() => {}); } catch (e) {}
    }, k * 380);
  }

  const oreoSnd = new Audio('assets/OREO.mp3');
  oreoSnd.preload = 'auto';
  let oreoAt = 0;
  function sayOreo(force) {
    if (isAnyMiniOverlayOpen()) return;
    const now = performance.now();
    if (!force && now - oreoAt < 4000) return;
    oreoAt = now;
    try { const a = oreoSnd.cloneNode(); a.volume = 0.95; a.play().catch(() => {}); } catch (e) {}
  }

  function showToast(text) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    document.body.appendChild(t);
    t.animate([
      { transform: 'translateX(-50%) translateY(15px) scale(.8)', opacity: 0 },
      { transform: 'translateX(-50%) translateY(0) scale(1.04)', opacity: 1, offset: .2 },
      { transform: 'translateX(-50%) translateY(-22px) scale(1)', opacity: 0 }
    ], { duration: 2100, easing: 'ease-out' }).onfinish = () => t.remove();
  }

  function levelUp(level, tier = 2) {
    haptic('notificationOccurred', 'success');
    const power = tier - 2;
    say67(Math.min(5, 1 + power));
    const AMP = 1 + power * .45;

    // Неоновая вспышка и драйв-тряска (без сторонних фото под АП!)
    stage.animate(Array.from({ length: 20 }, (_, k) => {
      const a = (1 - k / 19) * 22 * AMP;
      return { transform: `translate(${(Math.random() - .5) * a}px, ${(Math.random() - .5) * a}px)` };
    }), { duration: 650, easing: 'linear' });

    const fl = document.createElement('div');
    fl.className = 'flash';
    document.body.appendChild(fl);
    fl.animate([{ opacity: .75 }, { opacity: 0 }], { duration: 420, easing: 'ease-out' }).onfinish = () => fl.remove();

    const bonusCoins = roundCoin(level * 250);
    state.coins = roundCoin(state.coins + bonusCoins);
    showToast(`🎉 Уровень ${level}! +${fmt(bonusCoins)} 🪙 ОРЕО!`);
    scale.v += 8; spin.v += 120;
  }

  function addTaps(n) {
    const before = eventsAt(count);
    count = roundCoin(count + n);
    state.coins = roundCoin(state.coins + n);
    const after = eventsAt(count);
    if (after > before) levelUp(after + 1, tierOf(count));
    refreshHud();
  }

  // ---------- МОДАЛЬНОЕ ОКНО (ДОНАТ / ЭНЕРГИЯ / КЕЙСЫ) ----------
  function showModal(html) {
    $('modalCard').innerHTML = html;
    $('modalBackdrop').classList.add('show');
  }
  window._closeOreoModal = () => {
    $('modalBackdrop').classList.remove('show');
  };
  $('modalBackdrop').addEventListener('click', e => {
    if (e.target === $('modalBackdrop') && !window._modalLock) window._closeOreoModal();
  });

  // Окно "Энергия закончилась! Продолжить: посмотреть рекламу / задонатить"
  function showOutOfEnergyModal() {
    checkAndApplyOfflineEnergyRegen();
    const maxE = maxEnergy();
    const eCoinCost = roundCoin(400 * speedInflation()); // растёт пропорционально скорости тапа (всегда = 400 тапов!)
    const remMs = state.energyEmptySince ? Math.max(0, ENERGY_REFILL_DURATION_MS - (Date.now() - state.energyEmptySince)) : ENERGY_REFILL_DURATION_MS;
    const remMin = Math.ceil(remMs / 60000);
    showModal(`
      <div style="font-size:46px">⚡🍪</div>
      <h3>Энергия ОРЕО закончилась!</h3>
      <p>Автоматическое полное обновление энергии через <b>${remMin} мин.</b> (1 час после обнуления) или пополни прямо сейчас:</p>
      <button class="modal-btn ad" id="watchAdEnergyBtn">📺 Посмотреть рекламу (скоро подключение)</button>
      <button class="modal-btn primary" id="donateEnergyBtn">💎 Задонатить 25 Кристаллов (Полный бак ${maxE} ⚡ + Бонус)</button>
      <button class="modal-btn ghost" id="coinsEnergyBtn">🪙 Купить энергетик за ${fmt(eCoinCost)} 🪙 (+150 ⚡)</button>
      <button class="modal-btn ghost" onclick="window._closeOreoModal()">Подождать восстановления (1 час)</button>
    `);

    $('watchAdEnergyBtn').onclick = () => {
      showToast('📺 Реклама пока не подключена! Пополни за 🪙 или 💎');
    };

    $('donateEnergyBtn').onclick = () => {
      if (state.gems < 25) {
        window._closeOreoModal();
        openTab('donate');
        showToast('💎 Пополни ОРЕО-Кристаллы в разделе Донат!');
        return;
      }
      state.gems -= 25;
      state.energy = maxEnergy();
      state.energyEmptySince = 0;
      state.boostUntil = Math.max(Date.now(), state.boostUntil) + 60000;
      window._closeOreoModal();
      refreshHud();
      save();
      showToast('💎 Полный бак энергии и Турбо ×2 на 1 минуту!');
    };

    $('coinsEnergyBtn').onclick = () => {
      if (state.coins < eCoinCost) {
        showToast(`🪙 Недостаточно коинов (нужно ${fmt(eCoinCost)} 🪙)`);
        return;
      }
      state.coins = roundCoin(state.coins - eCoinCost);
      state.energy = Math.min(maxEnergy(), state.energy + 150);
      state.energyEmptySince = 0;
      window._closeOreoModal();
      refreshHud();
      save();
      showToast('⚡ +150 энергии ОРЕО!');
    };
  }

  $('energyHudBox').onclick = showOutOfEnergyModal;

  // ---------- ТАПАНИЕ ПО ПЕЧЕНЬКЕ И АНТИ-АФК СОН (1 МИНУТА) ----------
  const AFK_SLEEP_MS = 60000; // 1 минута без реального клика -> уход в сон
  let lastTapAt = 0;
  let lastRealTapAt = performance.now();
  let isSleeping = false;

  function wakeUpFromSleep() {
    lastRealTapAt = performance.now();
    if (isSleeping) {
      isSleeping = false;
      if (window.OreoMusic) window.OreoMusic.setSleepState(false);
      if ($('afkWakeBtn')) window._closeOreoModal();
      showToast('☀️ Ферма ОРЕО проснулась!');
    }
  }

  function enterSleepMode() {
    if (isSleeping) return;
    isSleeping = true;
    try { bgMusic.pause(); } catch (e) {}
    if (window.OreoMusic) window.OreoMusic.setSleepState(true);
    if (!$('modalBackdrop').classList.contains('show')) {
      showModal(`
        <div style="font-size:52px">😴🍪</div>
        <h3>Режим сна (Анти-АФК)</h3>
        <p>Ты не тапал больше <b>1 минуты</b>! Пассивные клики и авто-фарм на фоне остановлены.<br><br>Тапни, чтобы разбудить ОРЕО и продолжить фарм!</p>
        <button class="modal-btn primary" id="afkWakeBtn">🍪 Разбудить и тапать!</button>
      `);
      if ($('afkWakeBtn')) {
        $('afkWakeBtn').onclick = () => {
          wakeUpFromSleep();
          window._closeOreoModal();
        };
      }
    }
  }

  function popNumber(x, y, crit, text) {
    const el = document.createElement('div');
    const isShushik = state.equippedSkin === 'shushik';
    el.className = 'pop' + (isShushik ? ' shushik-pop' : '') + (crit ? ' crit' : '');
    el.textContent = text || '+1';
    if (isShushik) {
      el.style.color = crit ? '#ED1C24' : '#F0EAD6';
      if (crit) el.style.fontSize = 'clamp(30px, 7.5vmin, 52px)';
      el.style.textShadow = crit
        ? '0 3px 0 #8B1A28, 0 0 18px #F0EAD6, 0 8px 26px rgba(237, 28, 36, 0.96)'
        : '0 3px 0 #8B1A28, 0 0 14px #ED1C24, 0 6px 22px rgba(139, 26, 40, 0.92)';
    } else if (crit) {
      el.style.color = '#ffd76a';
      el.style.fontSize = 'clamp(30px, 7.5vmin, 52px)';
      el.style.textShadow = '0 3px 0 #c9541a, 0 6px 22px rgba(255,140,40,.9)';
    }
    const dx = (Math.random() - .5) * 90;
    const rot = (Math.random() - .5) * 30;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el);
    el.animate([
      { transform: `translate(-50%,-50%) scale(.4) rotate(${rot}deg)`, opacity: 0 },
      { transform: `translate(calc(-50% + ${dx*.3}px), calc(-50% - 30px)) scale(1.22) rotate(${rot}deg)`, opacity: 1, offset: .2 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% - 155px)) scale(1) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: 900, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => el.remove();
  }

  function sparks(x, y) {
    const isShushik = state.equippedSkin === 'shushik';
    if (window.BirchGames && window.BirchGames.isExclusiveSkin && window.BirchGames.isExclusiveSkin(state.equippedSkin)) {
      window.BirchGames.spawnParticles(state.equippedSkin, x, y);
      if (!isShushik) return;
    }
    const shushikColors = ['#ED1C24', '#F0EAD6', '#8B1A28'];
    const isGold = state.equippedSkin === 'gold' || state.equippedSkin === 'twix';
    for (let i = 0; i < 7; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      if (isShushik) {
        const sc = shushikColors[i % shushikColors.length];
        s.style.background = sc;
        s.style.boxShadow = `0 0 12px ${sc}, 0 0 6px #ED1C24`;
      } else if (isGold) {
        s.style.background = '#ffd740';
        s.style.boxShadow = '0 0 10px #ffd740';
      }
      s.style.left = x + 'px'; s.style.top = y + 'px';
      document.body.appendChild(s);
      const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 70;
      s.animate([
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
        { transform: `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px) scale(0)`, opacity: 0 }
      ], { duration: 500 + Math.random() * 250, easing: 'ease-out' }).onfinish = () => s.remove();
    }
  }

  function tap(x, y, auto) {
    if (isAnyMiniOverlayOpen()) {
      return;
    }
    if (auto && (isSleeping || document.hidden || (performance.now() - lastRealTapAt > AFK_SLEEP_MS))) {
      return;
    }
    if (isUnlimitedEnergyUser(playerId, playerName)) {
      state.vipUnlimitedEnergy = true;
    }
    if (auto) {
      // Авто-дрон тоже тратит энергию (0.5 ⚡ за клик) и останавливается, если бак пуст!
      if (!state.vipUnlimitedEnergy && state.energy < 0.5) {
        if (!state.energyEmptySince) state.energyEmptySince = Date.now();
        return;
      }
      if (!state.vipUnlimitedEnergy) {
        state.energy = Math.max(0, state.energy - 0.5);
        if (state.energy < 0.5 && !state.energyEmptySince) state.energyEmptySince = Date.now();
      }
    } else {
      wakeUpFromSleep();
      // Проверка энергии
      if (!state.vipUnlimitedEnergy && state.energy < 1) {
        if (!state.energyEmptySince) state.energyEmptySince = Date.now();
        // Проверим, не истёк ли уже 1 час с момента обнуления
        checkAndApplyOfflineEnergyRegen();
        if (state.energy < 1) {
          showOutOfEnergyModal();
          return;
        }
      }
      if (!state.vipUnlimitedEnergy) {
        state.energy = Math.max(0, state.energy - 1);
        if (state.energy < 1) {
          state.energyEmptySince = Date.now();
        } else {
          state.energyEmptySince = 0;
        }
      }

      // Запуск фоновой песни lil ptiric
      triggerMusicOnTap();

      // Авто-включение камеры с фильтром при тапании (если пользователь ещё не отключал вручную)
      if (!camEnabled && !camDenied && !userDisabledCam) {
        enableCamera(true);
      }

      // Пульсация фильтра камеры на фоне
      camPulse = 1;
      updateCamFilterVisual();
      setTimeout(() => { camPulse = 0; updateCamFilterVisual(); }, 120);

      const now = performance.now();
      combo = (now - lastTapAt < 450) ? Math.min(30, combo + 1) : 1;
      lastTapAt = now;

      state.dailyTaps++;
      if (combo > state.dailyMaxCombo) state.dailyMaxCombo = combo;
      if (camEnabled || !bgMusic.paused || (window.OreoMusic && window.OreoMusic.isPlaying())) state.dailyCamMusicTaps++;
    }

    const crit = !auto && Math.random() < critChance();
    const lucky = !auto && Math.random() < 1 / 250; // редкий «ОРЕО-тап»: ×2.5
    let gain = auto
      ? autoTapGain()
      : tapPower() * comboBonus() * (crit ? critMult() : 1) * (lucky ? 2.5 : 1);
    gain = Math.max(1, roundCoin(gain));
    addTaps(gain);

    if (lucky) sayOreo(true);
    else if (crit && Math.random() < .3) sayOreo(false);

    countEl.animate([
      { transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }
    ], { duration: 180, easing: 'ease-out' });

    const r = wrap.getBoundingClientRect();
    const nx = (x - (r.left + r.width / 2)) / (r.width / 2);
    const ny = (y - (r.top + r.height / 2)) / (r.height / 2);
    const cx = Math.max(-1, Math.min(1, nx)), cy = Math.max(-1, Math.min(1, ny));
    const k = auto ? .45 : 1;
    tiltY.v += cx * 140 * k;
    tiltX.v += -cy * 140 * k;
    scale.v -= (crit ? 9 : 5) * k;
    press.v += 8 * k;
    spin.v += ((cx * 40) + (Math.random() - .5) * 20) * k;

    if (!auto || Math.random() < .42) {
      popNumber(x, y, crit || lucky, lucky ? `ОРЕО! +${fmt(gain)}` : `+${fmt(gain)}`);
    }
    if (!auto) {
      sparks(x, y);
      if (tg) haptic('impactOccurred', crit || lucky ? 'heavy' : 'light');
      else if (navigator.vibrate) navigator.vibrate(crit ? 20 : 8);
    }
  }

  // Авто-тапы (быстрый цикл 80 мс для 18 кликов/с на MAX), реген энергии (1 час = 100%) и Анти-АФК (1 мин)
  let autoAcc = 0, autoLast = performance.now();
  setInterval(() => {
    const now = performance.now();
    const dt = (now - autoLast) / 1000;
    autoLast = now;

    // Регенерация энергии работает ВСЕГДА (даже в режиме сна Анти-АФК!), чтобы через 1 час энергия реально обновилась!
    const maxE = maxEnergy();
    if (!state.vipUnlimitedEnergy) {
      if (state.energyEmptySince && (Date.now() - state.energyEmptySince >= ENERGY_REFILL_DURATION_MS)) {
        state.energy = maxE;
        state.energyEmptySince = 0;
        state.lastEnergyTs = Date.now();
      } else if (state.energy < maxE) {
        const regenPerSec = maxE / 3600; // полный бак ровно за 1 час (3600 сек)
        state.energy = Math.min(maxE, state.energy + dt * regenPerSec);
        if (state.energy >= maxE) state.energyEmptySince = 0;
        state.lastEnergyTs = Date.now();
      }
    }

    // Если нет реальных кликов 1 минуту или вкладка свёрнута — уходим в сон, клики не идут!
    if (now - lastRealTapAt > AFK_SLEEP_MS) {
      enterSleepMode();
      autoAcc = 0;
      refreshHud();
      return;
    }
    if (document.hidden || isSleeping || isAnyMiniOverlayOpen()) {
      autoAcc = 0;
      return;
    }

    // Скромный пассивный бонус от рефералов (только пока сам тапаешь!)
    if (state.referralsCount > 0 && Math.random() < dt * 0.15) {
      const refGain = roundCoin(state.referralsCount * 15);
      state.coins = roundCoin(state.coins + refGain);
      state.refPassiveEarned = roundCoin(state.refPassiveEarned + refGain);
    }

    autoAcc += autoRate() * dt;
    while (autoAcc >= 1) {
      autoAcc -= 1;
      const r = wrap.getBoundingClientRect();
      tap(r.left + r.width * (.25 + Math.random() * .5), r.top + r.height * (.25 + Math.random() * .5), true);
    }
    refreshHud();
  }, 80);

  function rollCase(caseObj) {
    const today = todayStr();
    const dynCoinPrice = caseCoinCost(caseObj);
    if (caseObj.isFreeType === 'daily') {
      if (state.freeStarterClaimedDate === today) {
        showToast('⏳ Этот бесплатный кейс уже открыт сегодня! Приходи завтра.');
        return;
      }
      state.freeStarterClaimedDate = today;
    } else if (caseObj.isFreeType === 'activity') {
      if (state.freeActivityClaimedDate === today) {
        showToast('⏳ Бонус-кейс активности уже получен сегодня!');
        return;
      }
      if (state.dailyTaps < 250) {
        showToast(`👆 Сделай ещё ${250 - state.dailyTaps} тапов сегодня, чтобы открыть бесплатно!`);
        return;
      }
      state.freeActivityClaimedDate = today;
    } else if (caseObj.priceGems > 0 && caseObj.priceCoins === 0) {
      if (state.gems < caseObj.priceGems) {
        window._closeOreoModal();
        openTab('donate');
        showToast(`💎 Для VIP-кейса нужно ${caseObj.priceGems} 💎! Пополни в Магазине.`);
        return;
      }
      state.gems -= caseObj.priceGems;
    } else if (caseObj.priceGems > 0 && state.coins < dynCoinPrice) {
      if (state.gems < caseObj.priceGems) {
        showToast(`Нужно ${fmt(dynCoinPrice)} 🪙 или ${caseObj.priceGems} 💎!`);
        return;
      }
      state.gems -= caseObj.priceGems;
    } else {
      if (state.coins < dynCoinPrice) {
        showToast(`🪙 Не хватает печенько-коинов! Нужно ${fmt(dynCoinPrice)} 🪙`);
        return;
      }
      state.coins = roundCoin(state.coins - dynCoinPrice);
    }

    // Взвешенный рандом по таблице шансов
    const totalW = caseObj.drops.reduce((s, d) => s + d.chance, 0);
    let r = Math.random() * totalW;
    let wonSkinId = caseObj.drops[0].skin;
    for (const d of caseObj.drops) {
      if (r < d.chance) { wonSkinId = d.skin; break; }
      r -= d.chance;
    }

    state.inventory[wonSkinId] = (state.inventory[wonSkinId] || 0) + 1;
    state.dailyCasesOpened++;
    save();
    refreshHud();
    showRoulette(caseObj, wonSkinId);
  }

  function spinFortuneWheel() {
    const today = todayStr();
    if (state.wheelSpunDate === today) return;
    if ((state.dailyTaps || 0) < WHEEL_MIN_TAPS || state.coins < 200) return;

    state.wheelSpunDate = today;
    window._modalLock = true;
    const btn = $('spinWheelBtn');
    const closeBtn = $('wheelCloseBtn');
    if (btn) { btn.disabled = true; btn.textContent = '🎰 Крутится…'; }
    if (closeBtn) closeBtn.style.display = 'none';

    // Реальный шанс: 10% на удвоение (×2) и 90% на сгорание половины (-50%)
    const isWin = Math.random() < 0.10;

    // Сектора по 45 градусов: чётные (0,2,4,6) = ×2, нечётные (1,3,5,7) = -50%
    let sectorIdx;
    let offsetInsideSector;
    if (isWin) {
      const winSectors = [0, 2, 4, 6];
      sectorIdx = winSectors[Math.floor(Math.random() * winSectors.length)];
      offsetInsideSector = 14 + Math.random() * 17; // уверенно в золотом секторе
    } else {
      const loseSectors = [1, 3, 5, 7];
      sectorIdx = loseSectors[Math.floor(Math.random() * loseSectors.length)];
      // Останавливаем прямо у границы с золотым сектором ×2 для максимального азарта ("почти ×2!")
      offsetInsideSector = Math.random() < 0.5 ? (3.5 + Math.random() * 4.5) : (37 + Math.random() * 4.5);
    }

    const targetAngleOnWheel = sectorIdx * 45 + offsetInsideSector;
    const totalRotation = 360 * 8 + (360 - targetAngleOnWheel);

    const disc = $('fortuneWheelDisc');
    const ticker = setInterval(() => haptic('selectionChanged'), 130);
    const anim = disc.animate(
      [{ transform: 'rotate(0deg)' }, { transform: `rotate(${totalRotation}deg)` }],
      { duration: 5400, easing: 'cubic-bezier(0.06, 0.72, 0.08, 1)', fill: 'forwards' }
    );

    anim.onfinish = () => {
      clearInterval(ticker);
      window._modalLock = false;
      setTimeout(() => {
        if (isWin) {
          const gained = roundCoin(state.coins);
          state.coins = roundCoin(state.coins * 2);
          count = roundCoin(Math.max(state.coins, count * 2));
          state.count = count;
          save(); refreshHud(); syncCloudLeaderboard(); renderCurrentTab();
          haptic('notificationOccurred', 'success');
          sayOreo(true);
          confetti('#ffd740');
          showModal(`
            <div style="font-size:56px">🎰🔥</div>
            <h3>ДЖЕКПОТ ×2!</h3>
            <p>Невероятно! Колесо остановилось на золотом секторе <b>×2</b>!<br><br>Твой баланс удвоен: <b>+${fmt(gained)} 🪙</b> (итого <b>${fmt(state.coins)} 🪙</b>)!</p>

          `);
        } else {
          const burned = roundCoin(state.coins * 0.5);
          state.coins = roundCoin(Math.max(0, state.coins - burned));
          count = roundCoin(Math.max(0, count * 0.5));
          state.count = count;
          save(); refreshHud(); syncCloudLeaderboard(); renderCurrentTab();
          haptic('notificationOccurred', 'error');
          showModal(`
            <div style="font-size:56px">💀🎡</div>
            <h3>Половина сгорела!</h3>
            <p>Стрелка остановилась <b>в миллиметре от сектора ×2</b>...<br><br>Сгорело <b>-${fmt(burned)} 🪙</b>. Остаток: <b>${fmt(state.coins)} 🪙</b>.<br>Возвращайся завтра — в следующий раз точно выпадет ×2!</p>
            <button class="modal-btn primary" onclick="window._closeOreoModal()">😤 Отыграться тапами!</button>
          `);
        }
      }, 450);
    };
  }

  // ---------- РУЛЕТКА КЕЙСА (АЗАРТНЫЙ РЕЖИМ С NEAR-MISS) ----------
  function showRoulette(caseObj, wonId) {
    const TILE = 96, GAP = 8, STEP = TILE + GAP, N = 56, WIN = 46;
    const totalW = caseObj.drops.reduce((s, d) => s + d.chance, 0);
    const pick = () => {
      let r = Math.random() * totalW;
      for (const d of caseObj.drops) { if (r < d.chance) return d.skin; r -= d.chance; }
      return caseObj.drops[0].skin;
    };
    const items = [];
    for (let i = 0; i < N; i++) {
      if (i === WIN) {
        items.push(wonId);
      } else if ((i === WIN - 1 || i === WIN + 1) && wonId !== 'gold' && wonId !== 'twix' && Math.random() < 0.72) {
        // Азартный эффект «почти выпало!»: рядом с выигрышем мелькает Золотой ОРЕО или Твикс!
        items.push(Math.random() < 0.75 ? 'gold' : 'twix');
      } else if (Math.random() < 0.22) {

        items.push(['neon67', 'gold', 'twix'][Math.floor(Math.random() * 3)]);

    const edgeOffset = (Math.random() < 0.5 ? 1 : -1) * (24 + Math.random() * 16);

      { duration: 6200, easing: 'cubic-bezier(.05,.65,.08,1)', fill: 'forwards' }

      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    if (fallbackId && /^\d{5,15}$/.test(String(fallbackId))) {
      return `${escapeHtml(OREO_CONFIG.BACKEND_API_URL)}?action=avatar&amp;user_id=${encodeURIComponent(String(fallbackId))}`;
    }
    return '';
  }

  // Цена 1 кристалла: база 1 500 🪙 × инфляция скорости (в степени 0.8) × +20% за каждый уже купленный сегодня 💎
  function gemExchangeCost(offset = 0) {
    const boughtToday = (state.dailyGemsExchanged || 0) + offset;
    const speedFactor = Math.pow(speedInflation(), 0.8);
    const demandFactor = 1 + boughtToday * 0.20;
    return roundCoin(1500 * speedFactor * demandFactor);

  function gemBundleCost(qty) {
    let sum = 0;

  }

    body.insertAdjacentHTML('beforeend', walletHtml());

    const ad = document.createElement('div');
    ad.className = 'banner ad';
    ad.innerHTML = `<div class="b-ic">📺</div><div><b>+5 💎 за ролик</b><small>Скоро подключение</small></div><div class="b-btn">⏳ Скоро</div>`;
    ad.onclick = () => {
      showToast('📺 Рекламная сеть ОРЕО ещё подключается!');
    };
    body.appendChild(ad);

    const hit = document.createElement('div');
    hit.className = 'banner hit';
    hit.innerHTML = `<span class="ribbon">ХИТ</span><div class="b-ic">💳</div><div><b>Магнат ОРЕО</b><small>💎 100 + 🪙 250 000 · за ⭐ Stars</small></div><div class="b-btn">${OREO_CONFIG.RELEASE_MODE ? '⭐ 99 Stars' : '⏳ Скоро (⭐ 99)'}</div>`;
    hit.onclick = async () => {
      if (OREO_CONFIG.RELEASE_MODE) {
        try {
          showToast('⏳ Создаём счёт Telegram Stars…');
          const r = await fetch(`${OREO_CONFIG.BACKEND_API_URL}?action=invoice&pack=magnat&user_id=${encodeURIComponent(playerId)}`);
          const d = await r.json();
          if (d && d.ok && d.result && tg && tg.openInvoice) {
            tg.openInvoice(d.result, status => {
              if (status === 'paid') {
                state.gems += 100; state.coins = roundCoin(state.coins + 250000);
                save(); refreshHud(); renderCurrentTab();
                showToast('🎉 Оплачено! 💎 +100 · 🪙 +250 000');
              }
            });
            return;
          }
        } catch (e) {}
      }
      // Никаких бесплатных алмазов при клике!
      showToast('⭐ Оплата Telegram Stars скоро подключится! Пока меняй тапы на 💎 на бирже ниже.');
    };
    body.appendChild(hit);

    // Блок Обменника Тапов (Коинов) на Кристаллы 💎
    const exLeft = Math.max(0, DAILY_GEM_EXCHANGE_LIMIT - (state.dailyGemsExchanged || 0));
    const cost1 = gemBundleCost(1);
    const packQty = Math.min(5, Math.max(1, exLeft));
    const costPack = gemBundleCost(packQty);
    const approxTaps = Math.round(cost1 / Math.max(BASE_TAP, tapPower()));

    const exBox = document.createElement('div');
    exBox.className = 'invite';
    exBox.style.marginBottom = '12px';
    exBox.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b style="font-size:15px">🔄 Биржа: Тапы → Кристаллы 💎</b>
        <span style="font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(124,232,255,.16);color:#7ce8ff;font-weight:800">Лимит: ${state.dailyGemsExchanged || 0}/${DAILY_GEM_EXCHANGE_LIMIT} в день</span>
      </div>
      <div style="font-size:12px;opacity:.82;margin-bottom:10px;line-height:1.35">
        Курс 1 💎 сейчас: <b>🪙 ${fmt(cost1)}</b> (~<b>${fmtInt(approxTaps)}</b> твоих тапов).<br>
        <span style="opacity:.7">С каждой покупкой за день курс растёт на +20% (защита от инфляции).</span>
      </div>
      <div class="btn-row">
        <button class="big-btn tg" id="buyGem1Btn" ${exLeft < 1 ? 'disabled style="opacity:.5"' : ''}>
          ${exLeft < 1 ? '⏳ Лимит на сегодня исчерпан' : `💎 +1 за 🪙 ${fmt(cost1)}`}
        </button>
        ${exLeft >= 2 ? `<button class="big-btn copy" id="buyGemPackBtn" style="width:auto;padding:0 14px;font-size:13px;font-weight:900">💎 +${packQty} за 🪙 ${fmt(costPack)}</button>` : ''}
      </div>
    `;
    body.appendChild(exBox);

    const buyGemsFn = (qty) => {
      const rem = DAILY_GEM_EXCHANGE_LIMIT - (state.dailyGemsExchanged || 0);
      if (rem < qty) return showToast('⏳ Дневной лимит биржи исчерпан! Приходи завтра.');
      const totalC = gemBundleCost(qty);
      if (state.coins < totalC) {
        return showToast(`🪙 Не хватает натапанных коинов! Нужно ${fmt(totalC)} 🪙`);
      }
      state.coins = roundCoin(state.coins - totalC);
      state.gems += qty;
      state.dailyGemsExchanged = (state.dailyGemsExchanged || 0) + qty;
      sayOreo(false);
      save(); refreshHud(); renderCurrentTab();
      showToast(`💎 +${qty} Кристалл(ов) куплено за ${fmt(totalC)} 🪙!`);
    };
    if (exBox.querySelector('#buyGem1Btn') && exLeft >= 1) {
      exBox.querySelector('#buyGem1Btn').onclick = () => buyGemsFn(1);
    }
    if (exBox.querySelector('#buyGemPackBtn') && exLeft >= 2) {
      exBox.querySelector('#buyGemPackBtn').onclick = () => buyGemsFn(packQty);
    }

    // Цены на бустеры за коины растут пропорционально текущей силе тапа (speedInflation)!
    const turboCoinCost = roundCoin(1800 * speedInflation()); // всегда = 1 800 твоих текущих тапов
    const shieldCoinCost = roundCoin(2500 * speedInflation()); // всегда = 2 500 твоих текущих тапов

    const items = [
      { ic: '⚡', name: 'Полный бак', sub: '100% + ×2 · 1 мин', price: '💎 25',
        run: () => {
          if (state.gems < 25) return showToast('💎 Нужно 25');
          state.gems -= 25; state.energy = maxEnergy(); state.energyEmptySince = 0;
          state.boostUntil = Math.max(Date.now(), state.boostUntil) + 60000;
          showToast('🚀 Бак полный · ×2 на 1 мин');
        } },
      { ic: '🚀', name: 'Турбо ×2', sub: '90 сек · цена от скорости', price: `💎 45 / 🪙 ${fmt(turboCoinCost)}`,
        run: () => {
          if (state.gems >= 45) state.gems -= 45;
          else if (state.coins >= turboCoinCost) state.coins = roundCoin(state.coins - turboCoinCost);
          else return showToast(`💎 45 или 🪙 ${fmt(turboCoinCost)}`);
          state.boostUntil = Math.max(Date.now(), state.boostUntil) + 90000;
          showToast('🚀 Турбо ×2 · 90 сек');
        } },
      { ic: '🧊', name: 'Заморозка', sub: `у тебя: ${state.streakShields}`, price: `💎 30 / 🪙 ${fmt(shieldCoinCost)}`,
        run: () => {
          if (state.gems >= 30) state.gems -= 30;
          else if (state.coins >= shieldCoinCost) state.coins = roundCoin(state.coins - shieldCoinCost);
          else return showToast(`💎 30 или 🪙 ${fmt(shieldCoinCost)}`);
          state.streakShields++;
          showToast('🧊 +1 заморозка');
        } },
      { ic: '♾️', name: 'VIP энергия', sub: state.vipUnlimitedEnergy ? 'активно' : 'навсегда', price: state.vipUnlimitedEnergy ? '✓' : '💎 150',
        run: () => {
          if (state.vipUnlimitedEnergy) return;
          if (state.gems < 150) return showToast('💎 Нужно 150');
          state.gems -= 150; state.vipUnlimitedEnergy = true;
          showToast('👑 VIP активен');
        } }
    ];
    const grid = document.createElement('div');
    grid.className = 'grid2';
    items.forEach(b => {
      const t = document.createElement('div');
      t.className = 'tile can';
      t.innerHTML = `<div class="t-ic">${b.ic}</div><b>${b.name}</b><small>${b.sub}</small><div class="t-btn">${b.price}</div>`;
      t.onclick = () => { b.run(); save(); refreshHud(); renderCurrentTab(); };
      grid.appendChild(t);
    });
    body.appendChild(grid);
  }

  function renderCurrentTab() {
    if (!activeTab) return;
    const body = $('drawerBody');
    body.innerHTML = '';
    const fn = { upgrades: renderUpgrades, cases: renderCases, quests: renderQuests,
                 leaderboard: renderLeaderboard, refs: renderRefs, donate: renderDonate }[activeTab];
    if (fn) fn(body);
  }

  // Облачное сохранение Telegram
  if (tg && tg.CloudStorage) {
    tg.CloudStorage.getItem(SAVE_KEY, (err, val) => {
      if (err || !val) return;
      try {
        const cloud = JSON.parse(val);
        if ((cloud.economyVersion || 0) < OREO_CONFIG.ECONOMY_VERSION) return;
        if ((cloud.gemsWipeDone || 0) < 1) return;
        if (VIP_FOUNDERS.includes(initTgUid) && (cloud.founderGrantId || 0) < 1) return;
        if (initTgUid === PAVEL_ID && (cloud.pavelMovedToBank || 0) < 1) return;
        if (initTgUid === DENIS_ID && (cloud.denisRefund2B || 0) < 1) return;
        if ((cloud.count || 0) > count) {
          Object.assign(state, cloud);
          state.coins = roundCoin(state.coins);
          count = roundCoin(state.count);
          checkAndApplyOfflineEnergyRegen();
          applySkinVisuals();
          refreshHud();
        }
      } catch (e) {}
    });
  }

  refreshHud();
  syncCloudLeaderboard();
  setTimeout(() => { fetch(`${OREO_CONFIG.BACKEND_API_URL}?action=owl_check`).catch(() => {}); }, 4000);

  // Поддержка мульти-тача, кликов мыши и клавиатуры (без зажатия клавиши!)
  stage.addEventListener('pointerdown', e => {
    e.preventDefault();
    tap(e.clientX, e.clientY, false);
  });
  window.addEventListener('keydown', e => {
    if (e.repeat) return; // защита от зажатого пробела/энтера
    if (e.code === 'Space' || e.code === 'Enter') {
      const r = wrap.getBoundingClientRect();
      tap(r.left + r.width / 2 + (Math.random() - .5) * 120, r.top + r.height / 2 + (Math.random() - .5) * 120, false);
    }
  });
  window.OreoPerf = {
    setOverlay: (key, isOpen) => {
      if (key) _overlayPerfState[key] = Boolean(isOpen);
      if (isAnyMiniOverlayOpen()) {
        clearTimeout(musicFadeTimer);
        try { bgMusic.pause(); } catch (e) {}
        try { voice.pause(); } catch (e) {}
        try { oreoSnd.pause(); } catch (e) {}
        autoAcc = 0;
        stopMainRafLoop();
      } else {
        startMainRafLoop();
        if (!window.OreoMusic && musicMode === 'on' && bgMusic.paused) {
          bgMusic.play().catch(() => {});
        }
      }
      if (window.OreoMusic) {
        window.OreoMusic.notifyOverlayChange(key, Boolean(isOpen));
      }
    },
    isOverlayOpen: isAnyMiniOverlayOpen,
    pauseMainLoop: stopMainRafLoop,
    resumeMainLoop: startMainRafLoop
  };

  window.OreoBridge = {
    getState: () => state,
    applyExternalState: (patch) => {
      Object.assign(state, patch || {});
      state.coins = roundCoin(state.coins);
      if (patch && patch.gems !== undefined) state.gems = Math.max(0, Math.round(Number(patch.gems) || 0));
      if (patch && patch.energy !== undefined) state.energy = Math.max(0, Math.round(Number(patch.energy) || 0));
      if (patch && patch.sticks !== undefined) state.sticks = Math.max(0, Math.round(Number(patch.sticks) || 0));
      if (patch && patch.choppedLogs !== undefined) state.choppedLogs = Math.max(0, Math.round(Number(patch.choppedLogs) || 0));
      if (patch && patch.count !== undefined) {
        count = roundCoin(patch.count);
      } else {
        count = Math.max(count, state.coins);
      }
      state.count = count;
      save();
      refreshHud();
    },
    setOverlayActive: (key, isOpen) => window.OreoPerf.setOverlay(key, isOpen),
    save,
    refreshHud,
    applySkinVisuals,
    SKINS,
    CASES,
    showToast,
    showModal,
    playerId,
    playerName,
    playerPhoto,
    dbUrl: OREO_CONFIG.FIREBASE_DB_URL
  };
  window.OREO_BACKEND_API_URL = OREO_CONFIG.BACKEND_API_URL;
  window.db = OREO_CONFIG.FIREBASE_DB_URL;
})();
</script>
