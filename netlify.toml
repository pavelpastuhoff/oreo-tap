[build]
  publish = "."
  functions = "netlify/functions"

[functions."duolingo_owl"]
  schedule = "0 */4 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "payment=(), usb=(), geolocation=()"

[[redirects]]
  from = "/bot.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin_poker_bot.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Dockerfile"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/requirements.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true
